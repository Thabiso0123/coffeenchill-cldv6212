name: coffeenchill

services:
  azurite:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in the .env file}/coffeenchill-azurite:v1.0
    container_name: coffeenchill-azurite
    command: >
      azurite
      --blobHost 0.0.0.0
      --queueHost 0.0.0.0
      --tableHost 0.0.0.0
      --location /data
      --loose
      --skipApiVersionCheck
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data
    networks:
      - coffeenchill-net
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(10001,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  functions:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in the .env file}/coffeenchill-functions:v2.0
    container_name: coffeenchill-functions
    pull_policy: always
    ports:
      - "7071:80"
    environment:
      AzureWebJobsStorage: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;"
      FUNCTIONS_WORKER_RUNTIME: "dotnet-isolated"
      AzureFunctionsJobHost__Logging__Console__IsEnabled: "true"
      OrderProcessing__StageDelaySeconds: "${ORDER_STAGE_DELAY_SECONDS:-5}"
    depends_on:
      azurite:
        condition: service_healthy
    networks:
      - coffeenchill-net
    restart: unless-stopped

networks:
  coffeenchill-net:
    name: coffeenchill-net
    driver: bridge

volumes:
  azurite-data:
    name: coffeenchill-azurite-data
